<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Staunton Chess</title>
  
  <!-- Core Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      background: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      height: 60px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #1e293b;
    }
    .app-container {
      width: min(1200px, 96%);
      margin: 20px auto;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }
    @media (max-width: 850px) { .app-container { grid-template-columns: 1fr; } }
    .stage {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #1e293b;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: bold;
    }
    #webglContainer {
      width: 100%;
      height: 520px;
      border-radius: 8px;
      overflow: hidden;
      background: #020617;
      cursor: grab;
    }
    .panel {
      background: #0f172a;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #1e293b;
    }
    .btn {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { background: #334155; }
    .btn.active { background: #22c55e; border-color: #22c55e; }
    .history {
      background: #020617;
      border-radius: 6px;
      height: 150px;
      overflow-y: auto;
      padding: 10px;
      font-family: monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>👑 3D Chess Master</h3>
  </div>

  <div class="app-container">
    <div class="stage">
      <div class="status-bar">
        <span id="statusText">White's Turn</span>
        <span id="checkBadge" style="color: #ef4444; display:none;">CHECK!</span>
      </div>
      <div id="webglContainer"></div>
    </div>

    <div class="panel">
      <button class="btn" id="resetBtn">🔄 New Game</button>
      <button class="btn" id="undoBtn">↩️ Undo Move</button>
      <div>
        <label style="font-size: 0.8rem; color: #94a3b8;">Game Mode</label>
        <select id="modeSelect" class="btn" style="width: 100%; margin-top: 4px;">
          <option value="ai">🤖 vs AI Engine</option>
          <option value="pvp">👥 2 Players (Local)</option>
        </select>
      </div>
      <div class="history" id="history"></div>
    </div>
  </div>

  <script>
    // --- 1. CHESS LOGIC ---
    const game = new Chess();

    // --- 2. THREE.JS INITIALIZATION ---
    const container = document.getElementById('webglContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 10, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    // --- 3. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(8, 12, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- 4. BOARD CREATION ---
    const SQ_SIZE = 1.25;
    const OFFSET = (8 * SQ_SIZE) / 2 - SQ_SIZE / 2;
    const squareMeshes = {};
    let pieceMeshes = {};

    const lightMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 });

    // Board Base Frame
    const baseGeo = new THREE.BoxGeometry(11, 0.4, 11);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x020617 });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -0.25;
    scene.add(baseMesh);

    // Squares
    const sqGeo = new THREE.BoxGeometry(SQ_SIZE, 0.1, SQ_SIZE);
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const isLight = (r + c) % 2 === 0;
        const mesh = new THREE.Mesh(sqGeo, (isLight ? lightMat : darkMat).clone());
        const x = c * SQ_SIZE - OFFSET;
        const z = r * SQ_SIZE - OFFSET;
        mesh.position.set(x, 0, z);
        mesh.receiveShadow = true;
        
        const sqName = String.fromCharCode(97 + c) + (8 - r);
        mesh.userData = { sqName, r, c, isLight };
        scene.add(mesh);
        squareMeshes[sqName] = mesh;
      }
    }

    // --- 5. SIMPLE FAIL-PROOF 3D PIECES ---
    const whitePieceMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
    const blackPieceMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });

    function createPieceMesh(type, color) {
      const group = new THREE.Group();
      const mat = color === 'w' ? whitePieceMat : blackPieceMat;
      let geo;

      switch(type) {
        case 'p': // Pawn
          geo = new THREE.CylinderGeometry(0.2, 0.35, 0.6, 16);
          break;
        case 'r': // Rook
          geo = new THREE.BoxGeometry(0.6, 0.7, 0.6);
          break;
        case 'n': // Knight
          geo = new THREE.ConeGeometry(0.35, 0.8, 16);
          break;
        case 'b': // Bishop
          geo = new THREE.CylinderGeometry(0.1, 0.38, 0.9, 16);
          break;
        case 'q': // Queen
          geo = new THREE.CylinderGeometry(0.25, 0.42, 1.1, 16);
          break;
        case 'k': // King
          geo = new THREE.CylinderGeometry(0.3, 0.45, 1.3, 16);
          break;
      }

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.position.y = geo.parameters.height / 2 || 0.4;
      group.add(mesh);
      return group;
    }

    // --- 6. RENDER BOARD STATE ---
    let selectedSquare = null;
    let legalMoves = [];

    function updateBoard() {
      // Clear existing pieces
      Object.values(pieceMeshes).forEach(p => scene.remove(p));
      pieceMeshes = {};

      const board = game.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = board[r][c];
          const sqName = String.fromCharCode(97 + c) + (8 - r);
          
          // Reset square colors
          const sqMesh = squareMeshes[sqName];
          sqMesh.material.color.set(sqMesh.userData.isLight ? 0xe2e8f0 : 0x334155);

          if (piece) {
            const pMesh = createPieceMesh(piece.type, piece.color);
            const x = c * SQ_SIZE - OFFSET;
            const z = r * SQ_SIZE - OFFSET;
            pMesh.position.set(x, 0.05, z);
            scene.add(pMesh);
            pieceMeshes[sqName] = pMesh;
          }
        }
      }

      // Highlight selected square
      if (selectedSquare && squareMeshes[selectedSquare]) {
        squareMeshes[selectedSquare].material.color.set(0x22c55e);
      }

      // Highlight legal target moves
      legalMoves.forEach(m => {
        if (squareMeshes[m.to]) {
          squareMeshes[m.to].material.color.set(0x38bdf8);
        }
      });

      // Update UI Text
      document.getElementById('statusText').textContent = game.turn() === 'w' ? "White's Turn" : "Black's Turn";
      document.getElementById('checkBadge').style.display = game.in_check() ? 'inline' : 'none';

      // Update Move History
      const history = game.history();
      document.getElementById('history').innerHTML = history.map((m, i) => `${i % 2 === 0 ? (i/2 + 1) + '.' : ''} ${m}`).join(' ');
    }

    // --- 7. INTERACTION LOGIC ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    container.addEventListener('pointerdown', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(Object.values(squareMeshes));

      if (intersects.length > 0) {
        const clickedSq = intersects[0].object.userData.sqName;
        handleClick(clickedSq);
      }
    });

    function handleClick(sq) {
      const piece = game.get(sq);

      if (selectedSquare) {
        // Try executing move
        const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
        if (move) {
          selectedSquare = null;
          legalMoves = [];
          updateBoard();

          // AI Move trigger
          if (document.getElementById('modeSelect').value === 'ai' && !game.game_over() && game.turn() === 'b') {
            setTimeout(makeAIMove, 300);
          }
          return;
        }
      }

      // Select piece
      if (piece && piece.color === game.turn()) {
        selectedSquare = sq;
        legalMoves = game.moves({ square: sq, verbose: true });
      } else {
        selectedSquare = null;
        legalMoves = [];
      }

      updateBoard();
    }

    function makeAIMove() {
      const moves = game.moves();
      if (moves.length === 0) return;
      const randomMove = moves[Math.floor(Math.random() * moves.length)];
      game.move(randomMove);
      updateBoard();
    }

    // Buttons
    document.getElementById('resetBtn').onclick = () => { game.reset(); selectedSquare = null; legalMoves = []; updateBoard(); };
    document.getElementById('undoBtn').onclick = () => { game.undo(); if(document.getElementById('modeSelect').value === 'ai') game.undo(); selectedSquare = null; legalMoves = []; updateBoard(); };

    // --- 8. ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Start
    updateBoard();
    animate();
  </script>
</body>
</html>
