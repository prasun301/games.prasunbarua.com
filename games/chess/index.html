<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#07111f;--surface:rgba(17,29,46,.88);--surface2:rgba(4,10,20,.72);
 --border:rgba(255,255,255,.1);--text:#f8fafc;--muted:#94a3b8;
 --accent:#22c55e;--gold:#f5c451;--danger:#ef4444;
}
html,body{min-height:100%;background:var(--bg)}
body{
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 color:var(--text);background:radial-gradient(circle at top,#1b3150 0,#07111f 48%,#020617 100%);
 overflow-x:hidden;
}
button,select{font:inherit}
button{user-select:none}
.site-header{
 width:100%;height:64px;border-bottom:1px solid var(--border);
 background:rgba(7,17,31,.96);backdrop-filter:blur(14px);
 position:sticky;top:0;z-index:100;
}
.header-container{
 width:min(1200px,94%);height:100%;margin:auto;display:flex;
 align-items:center;justify-content:space-between;gap:14px;
}
.home-btn{
 color:var(--text);text-decoration:none;font-weight:700;font-size:.9rem;
 padding:8px 14px;border-radius:9px;background:rgba(255,255,255,.05);
 border:1px solid var(--border);transition:.2s;white-space:nowrap;
}
.home-btn:hover{background:rgba(255,255,255,.12);transform:translateX(-2px)}
.game-title{font-size:1.18rem;font-weight:800;letter-spacing:-.02em;text-align:center}
.header-spacer{width:110px}
.app-container{
 width:min(1200px,94%);margin:24px auto;display:grid;
 grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;
}
.board-stage,.control-panel{
 background:var(--surface);border:1px solid var(--border);border-radius:20px;
 box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
}
.board-stage{position:relative;padding:18px;min-width:0}
.status-bar{
 width:100%;display:flex;justify-content:space-between;align-items:center;
 margin-bottom:14px;padding:11px 16px;background:rgba(0,0,0,.3);
 border:1px solid var(--border);border-radius:12px;min-height:48px;
}
.turn-indicator{display:flex;align-items:center;gap:10px;font-weight:750}
.turn-dot{width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
.turn-dot.black{background:#1e293b;box-shadow:0 0 10px rgba(0,0,0,.9);border:1px solid #64748b}
#checkBadge{color:var(--danger);font-weight:850;display:none;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.webgl-container{
 position:relative;width:100%;height:min(66vw,620px);min-height:430px;
 border-radius:14px;overflow:hidden;background:#0c0906;
 border:1px solid rgba(255,255,255,.08);cursor:grab;
 touch-action:none;
}
.webgl-container.dragging{cursor:grabbing}
.webgl-container canvas{display:block;width:100%;height:100%}
.camera-hint{
 position:absolute;bottom:11px;left:11px;background:rgba(0,0,0,.62);
 backdrop-filter:blur(5px);padding:6px 10px;border-radius:7px;font-size:.72rem;
 color:var(--muted);pointer-events:none;border:1px solid rgba(255,255,255,.08);
}
.control-panel{padding:20px;display:flex;flex-direction:column;gap:17px}
.panel-section{display:flex;flex-direction:column;gap:9px}
.panel-title{
 font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;
 color:var(--muted);font-weight:800;
}
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{
 min-height:44px;padding:10px 13px;border-radius:10px;border:1px solid var(--border);
 background:rgba(255,255,255,.05);color:var(--text);font-weight:750;font-size:.87rem;
 cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
 transition:.18s;
}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px rgba(34,197,94,.25)}
select.btn{width:100%;appearance:none;text-align:left;padding-right:35px}
.select-wrap{position:relative}
.select-wrap:after{content:"⌄";position:absolute;right:13px;top:50%;transform:translateY(-53%);pointer-events:none;color:#cbd5e1}
.captured-box,.move-history{
 background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:11px;
}
.captured-box{
 min-height:42px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;
 gap:5px;font-size:1.18rem;letter-spacing:1px;
}
.captured-label{font-size:.7rem;color:var(--muted);margin-bottom:2px}
.move-history{
 height:150px;overflow-y:auto;padding:9px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 font-size:.82rem;color:#cbd5e1;
}
.move-row{display:grid;grid-template-columns:32px 1fr 1fr;gap:8px;padding:3px 0}
.move-num{color:#64748b}
.game-over-overlay{
 position:absolute;inset:18px;background:rgba(4,10,20,.88);backdrop-filter:blur(9px);
 border-radius:17px;z-index:50;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:13px;opacity:0;pointer-events:none;
 transition:opacity .3s;text-align:center;
}
.game-over-overlay.show{opacity:1;pointer-events:auto}
.game-over-title{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:900;color:var(--gold)}
.game-over-msg{color:var(--muted);max-width:90%}
.promotion-modal{
 position:absolute;inset:18px;z-index:60;background:rgba(4,10,20,.82);
 backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;
}
.promotion-modal.show{display:flex}
.promotion-card{
 background:#0d1828;border:1px solid var(--border);border-radius:16px;padding:20px;
 width:min(360px,90%);box-shadow:0 20px 60px rgba(0,0,0,.55);text-align:center;
}
.promotion-card h3{margin-bottom:14px}
.promotion-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.promo-btn{font-size:2rem;min-height:62px}
.thinking{
 display:none;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;
}
.thinking.show{display:flex}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce .8s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-4px);opacity:.4}}
@media(max-width:950px){
 .app-container{grid-template-columns:1fr}
 .control-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 .control-panel>.panel-section:nth-last-child(-n+2){grid-column:span 2}
}
@media(max-width:620px){
 .site-header{height:58px}.header-container{width:96%}
 .home-btn{padding:7px 10px;font-size:.78rem}.home-btn span:last-child{display:none}
 .header-spacer{width:42px}.game-title{font-size:.98rem}
 .app-container{width:96%;margin:10px auto;gap:10px}
 .board-stage{padding:10px;border-radius:15px}
 .status-bar{margin-bottom:9px;padding:9px 11px}
 .webgl-container{height:calc(100vw - 20px);min-height:300px;max-height:520px}
 .camera-hint{display:none}
 .control-panel{padding:13px;gap:12px;border-radius:15px}
 .btn{min-height:42px;padding:9px 8px;font-size:.78rem}
 .move-history{height:125px}
 .game-over-overlay,.promotion-modal{inset:10px}
}
</style>
</head>

</main>

<script>
'use strict';

const AudioEngine={
 enabled:true,ctx:null,
 init(){
  if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});
 },
 tone(type,startFreq,endFreq,duration,volume=.25){
  if(!this.enabled)return;
  try{
   this.init();
   const o=this.ctx.createOscillator(),g=this.ctx.createGain(),now=this.ctx.currentTime;
   o.type=type;o.frequency.setValueAtTime(startFreq,now);
   o.frequency.exponentialRampToValueAtTime(Math.max(endFreq,20),now+duration);
   g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.01,now+duration);
   o.connect(g);g.connect(this.ctx.destination);o.start(now);o.stop(now+duration);
  }catch(e){}
 },
 playMove(){this.tone('sine',220,60,.09,.32)},
 playCapture(){this.tone('triangle',380,80,.12,.4)},
 playCheck(){if(!this.enabled)return;[523.25,659.25].forEach((f,i)=>setTimeout(()=>this.tone('sine',f,f/2,.15,.22),i*80))}
};

const game=new Chess();

const container=document.getElementById('webglContainer');
const statusText=document.getElementById('statusText');
const turnDot=document.getElementById('turnDot');
const checkBadge=document.getElementById('checkBadge');
const toggleSoundBtn=document.getElementById('toggleSoundBtn');
const modeSelect=document.getElementById('modeSelect');
const undoBtn=document.getElementById('undoBtn');
const resetBtn=document.getElementById('resetBtn');
const resetCamBtn=document.getElementById('resetCamBtn');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const gameOverTitle=document.getElementById('gameOverTitle');
const gameOverMsg=document.getElementById('gameOverMsg');
const modalRestartBtn=document.getElementById('modalRestartBtn');
const thinking=document.getElementById('thinking');
const promotionModal=document.getElementById('promotionModal');

let scene,camera,renderer,controls;
let squareMeshes=[],pieceMeshes=[],highlightMeshes=[];
let selectedSquare=null,legalMovesForSelected=[],selectedPieceMesh=null;
let raycaster,mouse;
let aiBusy=false,pendingPromotion=null,animationLock=false;
let pointerDownX=0,pointerDownY=0,pointerDragged=false;

const BOARD_SIZE=8,SQ_SIZE=1.2;
const BOARD_OFFSET=(BOARD_SIZE*SQ_SIZE)/2-(SQ_SIZE/2);
const SURFACE_Y=.10,MOVE_ANIM_MS=280;

const PIECE_FOOTPRINT={p:.52,n:.62,b:.58,r:.64,q:.68,k:.70};
const pieceGeometryCache={};

function createWoodTexture(baseColor,grainColor,size=256){
 const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
 x.fillStyle=baseColor;x.fillRect(0,0,size,size);
 for(let i=0;i<38;i++){
  const y=Math.random()*size,amp=3+Math.random()*9;
  x.strokeStyle=grainColor;x.globalAlpha=.025+Math.random()*.07;
  x.lineWidth=.6+Math.random()*1.4;x.beginPath();x.moveTo(0,y);
  for(let px=0;px<=size;px+=16){
   const wobble=Math.sin(px/size*Math.PI*(2+Math.random()*2)+i)*amp;
   x.lineTo(px,y+wobble);
  }x.stroke();
 }
 x.globalAlpha=1;return new THREE.CanvasTexture(c);
}
function createGlowTexture(hex,soft=true){
 const size=128,c=document.createElement('canvas');c.width=c.height=size,x=c.getContext('2d');
 const col=new THREE.Color(hex),r=Math.round(col.r*255),g=Math.round(col.g*255),b=Math.round(col.b*255);
 const gr=x.createRadialGradient(64,64,0,64,64,64);
 gr.addColorStop(0,`rgba(${r},${g},${b},.95)`);
 gr.addColorStop(soft?.5:.72,`rgba(${r},${g},${b},.35)`);
 gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
 x.fillStyle=gr;x.fillRect(0,0,size,size);return new THREE.CanvasTexture(c);
}
function createRingTexture(hex){
 const size=128,c=document.createElement('canvas');c.width=c.height=size,x=c.getContext('2d');
 const col=new THREE.Color(hex);x.strokeStyle=`rgba(${Math.round(col.r*255)},${Math.round(col.g*255)},${Math.round(col.b*255)},.9)`;
 x.lineWidth=8;x.beginPath();x.arc(64,64,55,0,Math.PI*2);x.stroke();return new THREE.CanvasTexture(c);
}
function createContactShadowTexture(){
 const size=128,c=document.createElement('canvas');c.width=c.height=size,x=c.getContext('2d');
 const g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(.65,'rgba(0,0,0,.22)');g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.fillRect(0,0,size,size);return new THREE.CanvasTexture(c);
}
function createStudioBackground(){
 const size=512,c=document.createElement('canvas');c.width=c.height=size,x=c.getContext('2d');
 const g=x.createRadialGradient(256,205,30,256,256,380);
 g.addColorStop(0,'#2b2319');g.addColorStop(.45,'#161209');g.addColorStop(1,'#060504');
 x.fillStyle=g;x.fillRect(0,0,size,size);return new THREE.CanvasTexture(c);
}

const lightWoodTex=createWoodTexture('#e7c894','#8a6238');
const darkWoodTex=createWoodTexture('#4a2c1a','#190d07');
const whitePieceMaterial=new THREE.MeshPhysicalMaterial({color:0xf1e6d2,roughness:.26,metalness:0,clearcoat:.4,clearcoatRoughness:.12});
const blackPieceMaterial=new THREE.MeshPhysicalMaterial({color:0x231710,roughness:.3,metalness:0,clearcoat:.35,clearcoatRoughness:.15});
const lightSquareMat=new THREE.MeshPhysicalMaterial({color:0xf0dbae,map:lightWoodTex,roughness:.42,clearcoat:.15,clearcoatRoughness:.3});
const darkSquareMat=new THREE.MeshPhysicalMaterial({color:0x6b4226,map:darkWoodTex,roughness:.4,clearcoat:.18,clearcoatRoughness:.25});
const frameWoodMat=new THREE.MeshPhysicalMaterial({color:0x3a2415,map:darkWoodTex,roughness:.38,clearcoat:.3,clearcoatRoughness:.2});
const baseWoodMat=new THREE.MeshPhysicalMaterial({color:0x1b110a,roughness:.55,clearcoat:.08});

const contactShadowGeo=new THREE.PlaneGeometry(1,1);
const contactShadowMat=new THREE.MeshBasicMaterial({map:createContactShadowTexture(),transparent:true,opacity:.5,depthWrite:false});
const legalDotGeo=new THREE.PlaneGeometry(.32,.32);
const legalDotMat=new THREE.MeshBasicMaterial({map:createGlowTexture(0x22c55e,true),transparent:true,opacity:.85,depthWrite:false});
const captureRingGeo=new THREE.PlaneGeometry(1.06,1.06);
const captureRingMat=new THREE.MeshBasicMaterial({map:createRingTexture(0xf59e0b),transparent:true,opacity:.9,depthWrite:false});
const selectGlowGeo=new THREE.PlaneGeometry(1.16,1.16);
const selectGlowMat=new THREE.MeshBasicMaterial({map:createGlowTexture(0xf5c451,false),transparent:true,opacity:.55,depthWrite:false});

function smoothLathe(points,samples=40,segments=48){
 const curve=new THREE.SplineCurve(points.map(p=>new THREE.Vector2(p[0],p[1])));
 const pts=curve.getPoints(samples);pts.forEach(p=>{if(p.x<.001)p.x=.001});
 return new THREE.LatheGeometry(pts,segments);
}
function buildPawnGeometry(){
 const body=smoothLathe([[0,0],[.32,0],[.33,.025],[.30,.05],[.255,.07],[.27,.09],[.22,.115],[.15,.16],[.115,.24],[.11,.29],[.145,.33],[.125,.36],[.14,.395]]);
 const head=new THREE.SphereGeometry(.135,28,20);head.translate(0,.49,0);return[body,head];
}
function buildRookGeometry(){
 const body=smoothLathe([[0,0],[.40,0],[.415,.03],[.39,.055],[.33,.08],[.35,.10],[.30,.13],[.27,.20],[.26,.50],[.28,.54],[.32,.58],[.34,.62]]);
 const parts=[body];const rim=new THREE.CylinderGeometry(.34,.34,.06,48);rim.translate(0,.65,0);parts.push(rim);
 const mg=new THREE.BoxGeometry(.15,.16,.12);for(let i=0;i<8;i++){let a=i/8*Math.PI*2,g=mg.clone();g.rotateY(a);g.translate(Math.cos(a)*.27,.76,Math.sin(a)*.27);parts.push(g)}return parts;
}
function buildKnightGeometry(){
 const stem=smoothLathe([[0,0],[.38,0],[.395,.03],[.37,.055],[.30,.08],[.32,.10],[.24,.14],[.18,.22],[.165,.28],[.17,.30]],36,44);
 const pts=[[0,0],[.16,.02],[.22,.10],[.20,.18],[.24,.24],[.32,.24],[.40,.27],[.44,.32],[.40,.36],[.34,.34],[.30,.40],[.26,.46],[.20,.50],[.24,.56],[.18,.52],[.14,.58],[.06,.50],[-.06,.46],[-.14,.36],[-.14,.24],[-.08,.12],[-.04,0]];
 const shape=new THREE.Shape();shape.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>shape.lineTo(p[0],p[1]));shape.closePath();
 const head=new THREE.ExtrudeGeometry(shape,{depth:.30,bevelEnabled:true,bevelThickness:.025,bevelSize:.02,bevelSegments:3,curveSegments:6});
 head.translate(0,0,-.15);head.scale(.92,.92,.92);head.rotateZ(-.05);head.translate(0,.30,0);
 const e1=new THREE.ConeGeometry(.045,.16,10);e1.translate(.09,.77,-.05);e1.rotateZ(.12);const e2=e1.clone();e2.translate(0,.02,.15);
 const parts=[stem,head,e1,e2];parts.forEach(g=>g.rotateY(Math.PI/2));return parts;
}
function buildBishopGeometry(){
 const body=smoothLathe([[0,0],[.36,0],[.375,.03],[.35,.055],[.29,.08],[.30,.10],[.22,.14],[.155,.24],[.13,.40],[.15,.46],[.19,.52],[.165,.58],[.175,.63],[.15,.66]]);
 const mitre=new THREE.SphereGeometry(.155,28,20);mitre.translate(0,.75,0);
 const groove=new THREE.TorusGeometry(.152,.017,8,32,Math.PI*.9);groove.rotateZ(-.7);groove.translate(0,.75,0);
 const finial=new THREE.SphereGeometry(.04,16,12);finial.translate(0,.95,0);return[body,mitre,groove,finial];
}
function buildQueenGeometry(){
 const body=smoothLathe([[0,0],[.40,0],[.415,.03],[.39,.055],[.32,.08],[.34,.10],[.25,.15],[.19,.30],[.17,.55],[.20,.62],[.30,.70],[.26,.75]],44,48);
 const parts=[body];const coronet=new THREE.CylinderGeometry(.24,.26,.07,48);coronet.translate(0,.785,0);parts.push(coronet);
 const spike=new THREE.ConeGeometry(.035,.16,10),ball=new THREE.SphereGeometry(.028,12,10);
 for(let i=0;i<8;i++){let a=i/8*Math.PI*2,sx=Math.cos(a)*.205,sz=Math.sin(a)*.205,g=spike.clone();g.translate(sx,.865,sz);parts.push(g);let b=ball.clone();b.translate(sx,.955,sz);parts.push(b)}
 const f=new THREE.SphereGeometry(.06,18,14);f.translate(0,1.045,0);parts.push(f);return parts;
}
function buildKingGeometry(){
 const body=smoothLathe([[0,0],[.42,0],[.435,.03],[.41,.055],[.34,.08],[.36,.10],[.27,.16],[.20,.34],[.18,.60],[.21,.67],[.32,.75],[.27,.80]],44,48);
 const band=new THREE.CylinderGeometry(.25,.27,.09,48);band.translate(0,.845,0);
 const orb=new THREE.SphereGeometry(.10,22,16);orb.translate(0,.945,0);
 const cv=new THREE.CylinderGeometry(.032,.032,.26,14);cv.translate(0,1.175,0);
 const ch=new THREE.CylinderGeometry(.032,.032,.20,14);ch.rotateZ(Math.PI/2);ch.translate(0,1.12,0);
 const cj=new THREE.SphereGeometry(.045,14,12);cj.translate(0,1.12,0);
 return[body,band,orb,cv,ch,cj];
}
function buildAllPieceGeometries(){
 pieceGeometryCache.p=buildPawnGeometry();pieceGeometryCache.r=buildRookGeometry();
 pieceGeometryCache.n=buildKnightGeometry();pieceGeometryCache.b=buildBishopGeometry();
 pieceGeometryCache.q=buildQueenGeometry();pieceGeometryCache.k=buildKingGeometry();
}
function createPiece3DMesh(type,color){
 const group=new THREE.Group(),mat=color==='w'?whitePieceMaterial:blackPieceMaterial;
 pieceGeometryCache[type].forEach(geo=>{const m=new THREE.Mesh(geo,mat);m.castShadow=true;m.receiveShadow=true;group.add(m)});
 const shadow=new THREE.Mesh(contactShadowGeo,contactShadowMat);
 shadow.rotation.x=-Math.PI/2;const fp=PIECE_FOOTPRINT[type]||.55;shadow.scale.set(fp,fp,1);shadow.position.y=.012;shadow.renderOrder=1;group.add(shadow);
 group.userData={type,color,sqStr:null};return group;
}
function createFrameGeometry(outerSize,innerSize,height){
 const s=new THREE.Shape(),o=outerSize/2,i=innerSize/2;
 s.moveTo(-o,-o);s.lineTo(o,-o);s.lineTo(o,o);s.lineTo(-o,o);s.closePath();
 const h=new THREE.Path();h.moveTo(-i,-i);h.lineTo(-i,i);h.lineTo(i,i);h.lineTo(i,-i);h.closePath();s.holes.push(h);
 const g=new THREE.ExtrudeGeometry(s,{depth:height,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:3});
 g.rotateX(-Math.PI/2);g.translate(0,-height/2,0);return g;
}
function build3DBoard(){
 const play=BOARD_SIZE*SQ_SIZE,inner=play+.10,outer=inner+1.6;
 const base=new THREE.Mesh(new THREE.BoxGeometry(outer+.4,.32,outer+.4),baseWoodMat);base.position.y=-.36;base.receiveShadow=true;scene.add(base);
 const frame=new THREE.Mesh(createFrameGeometry(outer,inner,.34),frameWoodMat);frame.position.y=-.05;frame.castShadow=true;frame.receiveShadow=true;scene.add(frame);
 const filler=new THREE.Mesh(new THREE.BoxGeometry(play+.06,.34,play+.06),frameWoodMat);filler.position.y=-.19;filler.receiveShadow=true;scene.add(filler);
 const sqGeo=new THREE.BoxGeometry(SQ_SIZE-.02,.12,SQ_SIZE-.02);
 for(let r=0;r<8;r++){squareMeshes[r]=[];for(let c=0;c<8;c++){
  const mat=((r+c)%2===0?lightSquareMat:darkSquareMat).clone(),m=new THREE.Mesh(sqGeo,mat);
  m.position.set(c*SQ_SIZE-BOARD_OFFSET,.04,r*SQ_SIZE-BOARD_OFFSET);m.receiveShadow=true;
  m.userData={sqStr:String.fromCharCode(97+c)+(8-r),r,c};scene.add(m);squareMeshes[r][c]=m;
 }}
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(outer+3,outer+3),new THREE.MeshBasicMaterial({map:createContactShadowTexture(),transparent:true,opacity:.45,depthWrite:false}));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.53;scene.add(ground);
}
function setInitialCamera(){
 camera.position.set(0,9.2,10.8);camera.lookAt(0,SURFACE_Y,0);
}
function init3D(){
 scene=new THREE.Scene();scene.background=createStudioBackground();scene.fog=new THREE.Fog(0x0d0906,16,34);
 camera=new THREE.PerspectiveCamera(38,container.clientWidth/container.clientHeight,.1,100);setInitialCamera();
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setSize(container.clientWidth,container.clientHeight);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputEncoding=THREE.sRGBEncoding;
 container.appendChild(renderer.domElement);
 controls=new THREE.OrbitControls(camera,renderer.domElement);
 controls.enableDamping=true;controls.dampingFactor=.06;controls.enablePan=true;
 controls.maxPolarAngle=Math.PI/2-.04;controls.minDistance=8;controls.maxDistance=26;
 controls.target.set(0,SURFACE_Y,0);controls.update();controls.saveState();
 scene.add(new THREE.HemisphereLight(0xfff3e0,0x140d08,.55));
 const key=new THREE.DirectionalLight(0xfff1d6,1.15);key.position.set(-7,13,8);key.castShadow=true;
 key.shadow.mapSize.width=2048;key.shadow.mapSize.height=2048;key.shadow.camera.near=1;key.shadow.camera.far=34;
 key.shadow.camera.left=-7.5;key.shadow.camera.right=7.5;key.shadow.camera.top=7.5;key.shadow.camera.bottom=-7.5;
 key.shadow.bias=-.0015;key.shadow.radius=4;scene.add(key);
 const fill=new THREE.DirectionalLight(0xfff8f0,.32);fill.position.set(7,6,6);scene.add(fill);
 const rim=new THREE.DirectionalLight(0xffe9c8,.4);rim.position.set(0,9,-11);scene.add(rim);
 buildAllPieceGeometries();build3DBoard();setupInteraction();syncPiecesWithBoard();
 window.addEventListener('resize',onWindowResize,{passive:true});animate();
}
function disposeObject(obj){
 obj.traverse(o=>{if(o.geometry && !Object.values(pieceGeometryCache).flat().includes(o.geometry))o.geometry.dispose()});
}
function syncPiecesWithBoard(){
 pieceMeshes.forEach(p=>scene.remove(p));pieceMeshes=[];selectedPieceMesh=null;
 const board=game.board();
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const p=board[r][c];if(!p)continue;
  const mesh=createPiece3DMesh(p.type,p.color);
  mesh.position.set(c*SQ_SIZE-BOARD_OFFSET,SURFACE_Y,r*SQ_SIZE-BOARD_OFFSET);
  if(p.color==='b')mesh.rotation.y=Math.PI;
  mesh.userData.sqStr=String.fromCharCode(97+c)+(8-r);scene.add(mesh);pieceMeshes.push(mesh);
 }
 updateHighlightsAndStatus();
}
function setupInteraction(){
 raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();
 container.addEventListener('pointerdown',e=>{
  pointerDownX=e.clientX;pointerDownY=e.clientY;pointerDragged=false;
  container.classList.add('dragging');
 });
 container.addEventListener('pointermove',e=>{
  if(Math.hypot(e.clientX-pointerDownX,e.clientY-pointerDownY)>6)pointerDragged=true;
 });
 container.addEventListener('pointerup',e=>{
  container.classList.remove('dragging');
  if(pointerDragged || aiBusy || animationLock || game.game_over())return;
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(squareMeshes.flat(),false);
  if(hits.length)handleSquareClick(hits[0].object.userData.sqStr);
 });
}
function sqToCoords(s){return{r:8-parseInt(s[1],10),c:s.charCodeAt(0)-97}}
function sqToWorldPos(s){const {r,c}=sqToCoords(s);return{x:c*SQ_SIZE-BOARD_OFFSET,z:r*SQ_SIZE-BOARD_OFFSET}}
function handleSquareClick(sq){
 if(aiBusy||animationLock)return;
 const p=game.get(sq),current=p&&p.color===game.turn();
 if(selectedSquare){
  const move=legalMovesForSelected.find(m=>m.to===sq);
  if(move){
   if(move.promotion && move.promotion==='q' && move.from[1]!==move.to[1]){
    pendingPromotion=move;showPromotionModal();return;
   }
   selectedSquare=null;legalMovesForSelected=[];executeMove3D(move);return;
  }
 }
 if(current){selectedSquare=sq;legalMovesForSelected=game.moves({square:sq,verbose:true})}
 else{selectedSquare=null;legalMovesForSelected=[]}
 updateHighlightsAndStatus();
}
function showPromotionModal(){promotionModal.classList.add('show')}
function hidePromotionModal(){promotionModal.classList.remove('show')}
document.querySelectorAll('.promo-btn').forEach(btn=>btn.addEventListener('click',()=>{
 if(!pendingPromotion)return;
 const p=btn.dataset.piece,move={...pendingPromotion,promotion:p};
 pendingPromotion=null;hidePromotionModal();selectedSquare=null;legalMovesForSelected=[];executeMove3D(move);
}));
function tweenPosition(mesh,from,to,duration,done){
 const start=performance.now();
 function step(now){const t=Math.min((now-start)/duration,1),e=1-Math.pow(1-t,3);
  mesh.position.set(from.x+(to.x-from.x)*e,from.y+(to.y-from.y)*e,from.z+(to.z-from.z)*e);
  if(t<1)requestAnimationFrame(step);else if(done)done();
 }requestAnimationFrame(step);
}
function tweenCaptureOut(mesh,duration){
 const start=performance.now(),initialY=mesh.position.y;
 function step(now){const t=Math.min((now-start)/duration,1),s=Math.max(1-t,.001);
  mesh.scale.set(s,s,s);mesh.position.y=initialY+t*.15;
  if(t<1)requestAnimationFrame(step);else scene.remove(mesh);
 }requestAnimationFrame(step);
}
function animateMove(result){
 const moving=pieceMeshes.find(m=>m.userData.sqStr===result.from);
 if(moving){
  const from=moving.position.clone(),to=sqToWorldPos(result.to);
  tweenPosition(moving,from,{x:to.x,y:from.y,z:to.z},MOVE_ANIM_MS);
  moving.userData.sqStr=result.to;
 }
 if(result.flags.includes('e')){
  const capturedSq=result.to[0]+result.from[1],captured=pieceMeshes.find(m=>m.userData.sqStr===capturedSq&&m!==moving);
  if(captured)tweenCaptureOut(captured,MOVE_ANIM_MS);
 }else if(result.captured){
  const captured=pieceMeshes.find(m=>m.userData.sqStr===result.to&&m!==moving);
  if(captured)tweenCaptureOut(captured,MOVE_ANIM_MS);
 }
 if(result.flags.includes('k')||result.flags.includes('q')){
  const rank=result.color==='w'?'1':'8',king=result.flags.includes('k');
  const rf=(king?'h':'a')+rank,rt=(king?'f':'d')+rank,rook=pieceMeshes.find(m=>m.userData.sqStr===rf);
  if(rook){const from=rook.position.clone(),to=sqToWorldPos(rt);tweenPosition(rook,from,{x:to.x,y:from.y,z:to.z},MOVE_ANIM_MS);rook.userData.sqStr=rt}
 }
}
function executeMove3D(move){
 if(aiBusy&&game.turn()!=='b')return;
 const result=game.move({from:move.from,to:move.to,promotion:move.promotion||undefined});
 if(!result)return;
 animationLock=true;
 result.captured?AudioEngine.playCapture():AudioEngine.playMove();
 if(game.in_check())AudioEngine.playCheck();
 animateMove(result);updateHighlightsAndStatus();
 setTimeout(()=>{
  syncPiecesWithBoard();animationLock=false;
  if(!game.game_over()&&modeSelect.value.startsWith('ai')&&game.turn()==='b')setTimeout(makeAIMove,220);
 },MOVE_ANIM_MS+35);
}
function evaluateBoard(){
 const values={p:100,n:320,b:330,r:500,q:900,k:20000};
 let score=0;
 game.board().forEach((row,r)=>row.forEach((p,c)=>{
  if(!p)return;
  let v=values[p.type];
  const center=3.5-Math.abs(c-3.5)+3.5-Math.abs(r-3.5);
  if(p.type!=='k'&&p.type!=='p')v+=center*4;
  score+=(p.color==='b'?v:-v);
 }));
 return score;
}
function minimax(depth,alpha,beta,maximizing){
 if(depth===0||game.game_over())return evaluateBoard();
 const moves=game.moves({verbose:true});
 if(maximizing){
  let best=-Infinity;
  for(const m of moves){game.move(m);best=Math.max(best,minimax(depth-1,alpha,beta,false));game.undo();alpha=Math.max(alpha,best);if(beta<=alpha)break}
  return best;
 }else{
  let best=Infinity;
  for(const m of moves){game.move(m);best=Math.min(best,minimax(depth-1,alpha,beta,true));game.undo();beta=Math.min(beta,best);if(beta<=alpha)break}
  return best;
 }
}
function makeAIMove(){
 if(game.game_over()||game.turn()!=='b'||aiBusy)return;
 aiBusy=true;thinking.classList.add('show');updateControls();
 setTimeout(()=>{
  const moves=game.moves({verbose:true});if(!moves.length){aiBusy=false;thinking.classList.remove('show');return}
  let chosen;
  const mode=modeSelect.value;
  if(mode==='ai-easy')chosen=moves[Math.floor(Math.random()*moves.length)];
  else if(mode==='ai-medium'){
   const tactical=moves.filter(m=>m.captured||m.san.includes('+')||m.san.includes('#'));
   chosen=tactical.length?tactical[Math.floor(Math.random()*tactical.length)]:moves[Math.floor(Math.random()*moves.length)];
  }else{
   let best=-Infinity;chosen=moves[0];
   for(const m of moves){game.move(m);const score=minimax(1,-Infinity,Infinity,false);game.undo();if(score>best){best=score;chosen=m}}
  }
  aiBusy=false;thinking.classList.remove('show');updateControls();executeMove3D(chosen);
 },Math.min(mode==='ai-hard'?500:350,700));
}
function updateHighlightsAndStatus(){
 highlightMeshes.forEach(h=>scene.remove(h));highlightMeshes=[];
 if(selectedPieceMesh)selectedPieceMesh.position.y=SURFACE_Y;selectedPieceMesh=null;
 if(selectedSquare){
  const {r,c}=sqToCoords(selectedSquare),glow=new THREE.Mesh(selectGlowGeo,selectGlowMat);
  glow.rotation.x=-Math.PI/2;glow.position.set(c*SQ_SIZE-BOARD_OFFSET,SURFACE_Y+.005,r*SQ_SIZE-BOARD_OFFSET);
  scene.add(glow);highlightMeshes.push(glow);
  selectedPieceMesh=pieceMeshes.find(m=>m.userData.sqStr===selectedSquare)||null;
 }
 legalMovesForSelected.forEach(m=>{
  const {r,c}=sqToCoords(m.to),x=c*SQ_SIZE-BOARD_OFFSET,z=r*SQ_SIZE-BOARD_OFFSET;
  const mesh=new THREE.Mesh(m.captured?captureRingGeo:legalDotGeo,m.captured?captureRingMat:legalDotMat);
  mesh.rotation.x=-Math.PI/2;mesh.position.set(x,SURFACE_Y+.006,z);scene.add(mesh);highlightMeshes.push(mesh);
 });
 const turn=game.turn();statusText.textContent=turn==='w'?"White's Turn":"Black's Turn";
 turnDot.className='turn-dot'+(turn==='b'?' black':'');checkBadge.style.display=game.in_check()?'block':'none';
 if(game.game_over()){
  gameOverOverlay.classList.add('show');
  if(game.in_checkmate()){gameOverTitle.textContent='Checkmate!';gameOverMsg.textContent=`${turn==='w'?'Black':'White'} wins the game.`}
  else if(game.in_stalemate()){gameOverTitle.textContent='Stalemate';gameOverMsg.textContent='The game ends in a draw.'}
  else if(game.in_threefold_repetition()){gameOverTitle.textContent='Draw';gameOverMsg.textContent='Threefold repetition.'}
  else if(game.insufficient_material()){gameOverTitle.textContent='Draw';gameOverMsg.textContent='Insufficient material.'}
  else{gameOverTitle.textContent='Draw';gameOverMsg.textContent='The game ends in a draw.'}
 }else gameOverOverlay.classList.remove('show');
 updateCapturedAndHistoryUI();updateControls();
}
function updateCapturedAndHistoryUI(){
 const icons={w:{p:'♙',n:'♘',b:'♗',r:'♖',q:'♕'},b:{p:'♟',n:'♞',b:'♝',r:'♜',q:'♛'}};
 const initial={p:8,n:2,b:2,r:2,q:1},remaining={w:{...initial},b:{...initial}};
 game.board().forEach(row=>row.forEach(p=>{if(p&&p.type!=='k')remaining[p.color][p.type]--}));
 let cw=[],cb=[];
 Object.keys(initial).forEach(t=>{for(let i=0;i<remaining.b[t];i++)cw.push(icons.w[t]);for(let i=0;i<remaining.w[t];i++)cb.push(icons.b[t])});
 document.getElementById('capturedWhite').textContent=cw.join(' ')||'—';
 document.getElementById('capturedBlack').textContent=cb.join(' ')||'—';
 const el=document.getElementById('moveHistory');el.innerHTML='';
 const hist=game.history({verbose:true});
 for(let i=0;i<hist.length;i+=2){
  const row=document.createElement('div');row.className='move-row';
  const n=document.createElement('span');n.className='move-num';n.textContent=`${Math.floor(i/2)+1}.`;
  const w=document.createElement('span');w.textContent=hist[i]?.san||'';
  const b=document.createElement('span');b.textContent=hist[i+1]?.san||'';
  row.append(n,w,b);el.appendChild(row);
 }
 el.scrollTop=el.scrollHeight;
}
function updateControls(){
 undoBtn.disabled=game.history().length===0||aiBusy||animationLock;
 modeSelect.disabled=aiBusy||animationLock;
}
function startNewGame(){
 aiBusy=false;thinking.classList.remove('show');hidePromotionModal();pendingPromotion=null;
 game.reset();selectedSquare=null;legalMovesForSelected=[];animationLock=false;syncPiecesWithBoard();
}
resetBtn.addEventListener('click',startNewGame);modalRestartBtn.addEventListener('click',startNewGame);
undoBtn.addEventListener('click',()=>{
 if(aiBusy||animationLock)return;
 const steps=modeSelect.value.startsWith('ai')?Math.min(2,game.history().length):1;
 for(let i=0;i<steps;i++)if(game.history().length)game.undo();
 selectedSquare=null;legalMovesForSelected=[];syncPiecesWithBoard();
});
modeSelect.addEventListener('change',()=>{
 startNewGame();
 if(modeSelect.value.startsWith('ai')&&game.turn()==='b')setTimeout(makeAIMove,250);
});
toggleSoundBtn.addEventListener('click',()=>{
 AudioEngine.enabled=!AudioEngine.enabled;toggleSoundBtn.classList.toggle('active',AudioEngine.enabled);
 toggleSoundBtn.textContent=AudioEngine.enabled?'🔊 Sound ON':'🔇 Muted';
 if(AudioEngine.enabled)AudioEngine.init();
});
resetCamBtn.addEventListener('click',()=>{controls.reset();controls.update()});
function animate(){
 requestAnimationFrame(animate);controls.update();
 if(selectedPieceMesh){const t=performance.now()*.004;selectedPieceMesh.position.y=SURFACE_Y+.02+Math.sin(t)*.02}
 renderer.render(scene,camera);
}
function onWindowResize(){
 const w=container.clientWidth,h=container.clientHeight;if(!w||!h)return;
 camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
}
init3D();
</script>
</body>
</html>
