<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Prasun Games for feedback, questions, or game suggestions.">
    <title>Contact Us - Prasun Games</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="./" class="brand">🎮 Prasun Games</a>
            <nav class="header-nav">
                <a href="./" class="header-link">Home</a>
                <a href="about.html" class="header-link">About</a>
                <a href="contact.html" class="header-link" style="color: var(--text);">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="content-box" style="max-width: 640px;">
            <h1>Contact Us</h1>
            <p class="update-date">Get in Touch</p>
            
            <p>Have questions, feedback, or suggestions for new web games? Send a message below or visit <a href="https://prasunbarua.com" target="_blank" rel="noopener">Prasun Barua's official portfolio</a>.</p>

            <!-- Replace the action attribute with your Formspree endpoint (e.g., https://formspree.io/f/your-id) -->
            <form class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="_replyto" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="play-button" style="border: none; cursor: pointer; justify-content: center; width: 100%; margin-top: 10px;">Send Message →</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="./">Home</a>
                <a href="about.html">About Us</a>
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
                <a href="contact.html">Contact</a>
            </div>
            <p class="footer-copy">© 2026 Prasun Games by <a href="https://prasunbarua.com" target="_blank" rel="noopener">Prasun Barua</a>. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
